name: Delete EC2 Instance

on:
  workflow_dispatch:
    inputs:
      confirm_delete:
        description: 'Type "yes" to confirm deletion'
        required: true
        type: string

env:
  AWS_REGION: us-east-1
  STACK_NAME: ec2-instance-stack

permissions:
  id-token: write
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm_delete == 'yes'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete CloudFormation stack
        run: |
          aws cloudformation delete-stack --stack-name ${{ env.STACK_NAME }}
          echo "Stack deletion initiated. Waiting for completion..."
          aws cloudformation wait stack-delete-complete --stack-name ${{ env.STACK_NAME }}
          echo "Stack deletion completed successfully"

name: Deploy EC2 Instance

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      assign_public_ip:
        description: 'Assign public IP to instance'
        type: choice
        required: true
        default: 'false'
        options:
          - 'true'
          - 'false'
      key_pair_name:
        description: 'EC2 KeyPair name for SSH access (optional)'
        type: string
        required: false
        default: ''

env:
  AWS_REGION: us-east-1
  STACK_NAME: ec2-instance-stack

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload spicepod config to S3
        run: |
          BUCKET_NAME="${{ env.STACK_NAME }}-config-$(aws sts get-caller-identity --query 'Account' --output text)"

          # Create bucket if it doesn't exist
          if ! aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Creating S3 bucket '$BUCKET_NAME'..."
            if [[ "${{ env.AWS_REGION }}" == "us-east-1" ]]; then
              # us-east-1 requires no LocationConstraint
              aws s3api create-bucket --bucket "$BUCKET_NAME" || {
                echo "Failed to create S3 bucket. Please ensure the GitHub Actions role has s3:CreateBucket permission."
                exit 1
              }
            else
              # Other regions require LocationConstraint
              aws s3api create-bucket \
                --bucket "$BUCKET_NAME" \
                --region ${{ env.AWS_REGION }} \
                --create-bucket-configuration LocationConstraint=${{ env.AWS_REGION }} || {
                echo "Failed to create S3 bucket. Please ensure the GitHub Actions role has s3:CreateBucket permission."
                exit 1
              }
            fi
            
            # Configure bucket defaults
            aws s3api put-public-access-block \
              --bucket "$BUCKET_NAME" \
              --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET_NAME" \
              --versioning-configuration Status=Enabled
          fi

          # Upload configs
          aws s3 cp spicepod.yaml "s3://$BUCKET_NAME/spicepod.yaml"
          aws s3 cp config/cloudwatch-agent-config.json "s3://$BUCKET_NAME/cloudwatch-agent-config.json"

      - name: Deploy CloudFormation stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: ${{ env.STACK_NAME }}
          template: cloudformation/ec2-template.yml
          no-fail-on-empty-changeset: '1'
          parameter-overrides: >-
            VpcId=${{ secrets.VPC_ID }},
            SubnetId=${{ secrets.SUBNET_ID }},
            InstanceType=t3.micro,
            AssignPublicIP=${{ github.event.inputs.assign_public_ip || 'false' }},
            KeyPairName=${{ github.event.inputs.key_pair_name || secrets.KEY_PAIR_NAME || '' }}

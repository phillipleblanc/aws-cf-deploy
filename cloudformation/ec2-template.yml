AWSTemplateFormatVersion: '2010-09-09'
Description: 'EC2 instance with Secrets Manager access'

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the EC2 instance will be launched

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet where the EC2 instance will be launched

  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type

  VolumeSize:
    Type: Number
    Default: 20
    Description: Size of the EBS volume in GB
    MinValue: 1
    MaxValue: 16384

  VolumeType:
    Type: String
    Default: gp3
    Description: EBS volume type
    AllowedValues:
      - gp2
      - gp3
      - io1
      - io2
      - st1
      - sc1
      - standard

  KeyPairName:
    Type: String
    Description: Name of an existing EC2 KeyPair for SSH access (optional)
    Default: ""

  AssignPublicIP:
    Type: String
    Description: Whether to assign a public IP address to the instance
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  PrivateKeySecretName:
    Type: String
    Description: Name of the secret in AWS Secrets Manager that contains the private key

Conditions:
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, ""]]
  IsPublicInstance: !Equals [!Ref AssignPublicIP, "true"]

Resources:
  DataVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !GetAtt EC2Instance.AvailabilityZone
      Size: !Ref VolumeSize
      VolumeType: !Ref VolumeType
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-data-volume

  VolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref EC2Instance
      VolumeId: !Ref DataVolume

  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecretsManagerReadWrite
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
      Path: /
      Policies:
        - PolicyName: S3ConfigAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub arn:aws:s3:::${AWS::StackName}-config-${AWS::AccountId}/*

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref EC2InstanceRole

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EC2 instance
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - !If 
          - IsPublicInstance
          - IpProtocol: tcp
            FromPort: 22
            ToPort: 22
            CidrIp: 0.0.0.0/0
            Description: Allow SSH access from anywhere when public IP is enabled
          - !Ref AWS::NoValue

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Sub '{{resolve:ssm:/aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id}}'
      KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref "AWS::NoValue"]
      IamInstanceProfile: !Ref EC2InstanceProfile
      NetworkInterfaces:
        - DeviceIndex: 0
          SubnetId: !Ref SubnetId
          GroupSet: 
            - !Ref EC2SecurityGroup
          AssociatePublicIpAddress: !Ref AssignPublicIP
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          
          # Enable command logging and exit on error
          set -x
          exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1
          
          echo "Starting UserData script execution..."
          
          echo "Installing required packages..."
          
          # Update package list and install required packages
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y jq curl awscli || {
            echo "Failed to install required packages"
            exit 1
          }

          # Install CloudWatch Logs agent
          curl -o /root/amazon-cloudwatch-agent.deb https://s3.amazonaws.com/amazoncloudwatch-agent/debian/amd64/latest/amazon-cloudwatch-agent.deb
          dpkg -i -E /root/amazon-cloudwatch-agent.deb

          # Download CloudWatch agent config from S3
          aws s3 cp s3://${AWS::StackName}-config-${AWS::AccountId}/cloudwatch-agent-config.json /opt/aws/amazon-cloudwatch-agent/bin/config.json || {
            echo "Failed to download CloudWatch config"
            exit 1
          }

          # Start CloudWatch agent
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent/bin/config.json
          systemctl enable amazon-cloudwatch-agent
          systemctl start amazon-cloudwatch-agent

          # Setup EBS volume
          echo "Setting up EBS volume..."
          while [ ! -e /dev/nvme1n1 ] && [ ! -e /dev/xvdf ]; do
            echo "Waiting for EBS volume to be attached..."
            sleep 5
          done

          DEVICE_NAME="/dev/nvme1n1"
          if [ ! -e "$DEVICE_NAME" ]; then
            DEVICE_NAME="/dev/xvdf"
          fi

          # Check if the volume is already formatted
          if ! blkid $DEVICE_NAME; then
            echo "Formatting EBS volume..."
            mkfs -t ext4 $DEVICE_NAME || {
              echo "Failed to format EBS volume"
              exit 1
            }
          fi

          # Create mount point and add to fstab
          echo "Creating mount point..."
          mkdir -p /data || {
            echo "Failed to create /data directory"
            exit 1
          }

          # Get the UUID of the formatted volume
          UUID=$(blkid -s UUID -o value $DEVICE_NAME)
          if [ -z "$UUID" ]; then
            echo "Failed to get UUID of formatted volume"
            exit 1
          fi

          # Add to fstab using UUID
          echo "UUID=$UUID /data ext4 defaults,nofail 0 2" >> /etc/fstab || {
            echo "Failed to update fstab"
            exit 1
          }

          # Mount the volume
          mount /data || {
            echo "Failed to mount volume"
            exit 1
          }

          # Set permissions
          chown ubuntu:ubuntu /data
          chmod 755 /data

          echo "Creating app directory..."
          mkdir -p /app || {
            echo "Failed to create /app directory"
            exit 1
          }

          echo "Retrieving private key from Secrets Manager..."
          aws secretsmanager get-secret-value --secret-id "${PrivateKeySecretName}" --query 'SecretString' --output text > /app/privatekey.p8 || {
            echo "Failed to retrieve private key from Secrets Manager"
            exit 1
          }

          # Set correct permissions for private key
          chmod 600 /app/privatekey.p8 || {
            echo "Failed to set permissions on private key"
            exit 1
          }

          # Download spicepod config from S3
          aws s3 cp s3://${AWS::StackName}-config-${AWS::AccountId}/spicepod.yaml /app/spicepod.yaml || {
            echo "Failed to download spicepod config"
            exit 1
          }

          DOWNLOAD_URL=https://public-data.spiceai.org/spiced_models_linux_x86_64_1.1.0-unstable-snowflake.tar.gz
          
          echo "Downloading binary from $DOWNLOAD_URL..."
          cd /tmp
          curl -L -o spiced.tar.gz "$DOWNLOAD_URL" || {
            echo "Failed to download binary"
            exit 1
          }
          
          echo "Extracting binary..."
          tar xzf spiced.tar.gz || {
            echo "Failed to extract binary"
            exit 1
          }
          
          echo "Installing binary..."
          mv spiced /usr/local/bin/ || {
            echo "Failed to move binary to /usr/local/bin"
            exit 1
          }
          chmod +x /usr/local/bin/spiced || {
            echo "Failed to make binary executable"
            exit 1
          }

          echo "Creating systemd service file..."
          cat > /etc/systemd/system/spiced.service << 'EOL'
          [Unit]
          Description=Spice.ai Runtime Service
          After=network.target amazon-cloudwatch-agent.service

          [Service]
          Type=simple
          User=ubuntu
          WorkingDirectory=/app
          ExecStart=/usr/local/bin/spiced --flight 0.0.0.0:50051 --http 0.0.0.0:8090
          Restart=always
          RestartSec=5
          StandardOutput=append:/var/log/spiced.log
          StandardError=append:/var/log/spiced.error.log

          [Install]
          WantedBy=multi-user.target
          EOL

          # Create log files and set permissions
          touch /var/log/spiced.log /var/log/spiced.error.log
          chown ubuntu:ubuntu /var/log/spiced.log /var/log/spiced.error.log
          chmod 644 /var/log/spiced.log /var/log/spiced.error.log

          echo "Setting permissions..."
          chown -R ubuntu:ubuntu /app
          chmod 755 /app
          
          echo "Setting up service..."
          systemctl daemon-reload || {
            echo "Failed to reload systemd"
            exit 1
          }
          
          systemctl enable spiced || {
            echo "Failed to enable spiced service"
            exit 1
          }
          
          systemctl start spiced || {
            echo "Failed to start spiced service"
            exit 1
          }

          echo "UserData script completed successfully"
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-instance

Outputs:
  InstanceId:
    Description: ID of the EC2 instance
    Value: !Ref EC2Instance

  InstancePrivateIP:
    Description: Private IP address of the EC2 instance
    Value: !GetAtt EC2Instance.PrivateIp 
AWSTemplateFormatVersion: '2010-09-09'
Description: 'EC2 instance with Secrets Manager access'

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the EC2 instance will be launched

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet where the EC2 instance will be launched

  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type

  VolumeSize:
    Type: Number
    Default: 20
    Description: Size of the EBS volume in GB
    MinValue: 1
    MaxValue: 16384

  VolumeType:
    Type: String
    Default: gp3
    Description: EBS volume type
    AllowedValues:
      - gp2
      - gp3
      - io1
      - io2
      - st1
      - sc1
      - standard

  KeyPairName:
    Type: String
    Description: Name of an existing EC2 KeyPair for SSH access (optional)
    Default: ""

  PrivateKeySecretName:
    Type: String
    Description: Name of the secret in AWS Secrets Manager that contains the private key

Conditions:
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, ""]]

Resources:
  DataVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !GetAtt EC2Instance.AvailabilityZone
      Size: !Ref VolumeSize
      VolumeType: !Ref VolumeType
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-data-volume

  VolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref EC2Instance
      VolumeId: !Ref DataVolume

  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecretsManagerReadWrite
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
      Path: /
      Policies:
        - PolicyName: S3ConfigAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub arn:aws:s3:::${AWS::StackName}-config-${AWS::AccountId}/*

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref EC2InstanceRole

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EC2 instance
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - !If 
          - IsPublicInstance
          - IpProtocol: tcp
            FromPort: 22
            ToPort: 22
            CidrIp: 0.0.0.0/0
            Description: Allow SSH access from anywhere when public IP is enabled
          - !Ref AWS::NoValue

  EC2Instance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Timeout: PT15M
    UpdatePolicy:
      AutoScalingRollingUpdate:
        WaitOnResourceSignals: true
        MaxBatchSize: 1
        MinInstancesInService: 0
        PauseTime: PT15M
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Sub '{{resolve:ssm:/aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id}}'
      KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref "AWS::NoValue"]
      IamInstanceProfile: !Ref EC2InstanceProfile
      NetworkInterfaces:
        - DeviceIndex: 0
          SubnetId: !Ref SubnetId
          GroupSet: 
            - !Ref EC2SecurityGroup
      Metadata:
        AWS::CloudFormation::Init:
          configSets:
            default:
              - install_deps
              - configure_updates
              - configure_secrets
              - configure_services
          install_deps:
            packages:
              apt:
                jq: []
                curl: []
                awscli: []
                python3-pip: []
            commands:
              01_install_cfn_tools:
                command: pip3 install https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-latest.tar.gz
          configure_updates:
            files:
              "/usr/local/bin/update-spice.sh":
                content: !Sub |
                  #!/bin/bash
                  set -e
                  
                  echo "Starting configuration update at $(date)"
                  
                  # Update spicepod config
                  aws s3 cp s3://${AWS::StackName}-config-${AWS::AccountId}/spicepod.yaml /app/spicepod.yaml.new
                  if [ -f /app/spicepod.yaml.new ]; then
                    mv /app/spicepod.yaml.new /app/spicepod.yaml
                    chown ubuntu:ubuntu /app/spicepod.yaml
                    chmod 644 /app/spicepod.yaml
                    echo "Updated spicepod config"
                  fi
                  
                  # Update CloudWatch config
                  aws s3 cp s3://${AWS::StackName}-config-${AWS::AccountId}/cloudwatch-agent-config.json /opt/aws/amazon-cloudwatch-agent/bin/config.json.new
                  if [ -f /opt/aws/amazon-cloudwatch-agent/bin/config.json.new ]; then
                    mv /opt/aws/amazon-cloudwatch-agent/bin/config.json.new /opt/aws/amazon-cloudwatch-agent/bin/config.json
                    systemctl restart amazon-cloudwatch-agent
                    echo "Updated CloudWatch config"
                  fi
                  
                  # Check for new binary version
                  DOWNLOAD_URL=https://public-data.spiceai.org/spiced_models_linux_x86_64_1.1.0-unstable-snowflake.tar.gz
                  CURRENT_VERSION=$(spiced --version 2>/dev/null || echo "none")
                  
                  cd /tmp
                  curl -L -o spiced.tar.gz "$DOWNLOAD_URL"
                  tar xzf spiced.tar.gz
                  NEW_VERSION=$(./spiced --version 2>/dev/null || echo "none")
                  
                  if [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
                    systemctl stop spiced
                    mv spiced /usr/local/bin/
                    chmod +x /usr/local/bin/spiced
                    echo "Updated spice binary from $CURRENT_VERSION to $NEW_VERSION"
                  fi
                  
                  rm -f spiced.tar.gz spiced
                  
                  # Reload systemd in case service file was updated
                  systemctl daemon-reload
                  
                  # Always restart spiced service to pick up any config changes
                  systemctl restart spiced
                  
                  echo "Configuration update completed at $(date)"
                mode: "000755"
                owner: "root"
                group: "root"
          configure_secrets:
            commands:
              01_retrieve_private_key:
                command: !Sub |
                  aws secretsmanager get-secret-value --secret-id "${PrivateKeySecretName}" --query 'SecretString' --output text > /app/privatekey.p8
                  chmod 600 /app/privatekey.p8
                  chown ubuntu:ubuntu /app/privatekey.p8
          configure_services:
            files:
              "/etc/systemd/system/spiced.service":
                content: |
                  [Unit]
                  Description=Spice.ai Runtime Service
                  After=network.target amazon-cloudwatch-agent.service
                  
                  [Service]
                  Type=simple
                  User=ubuntu
                  WorkingDirectory=/app
                  ExecStart=/usr/local/bin/spiced --flight 0.0.0.0:50051 --http 0.0.0.0:8090
                  Restart=always
                  RestartSec=5
                  StandardOutput=append:/var/log/spiced.log
                  StandardError=append:/var/log/spiced.error.log
                  
                  [Install]
                  WantedBy=multi-user.target
                mode: "000644"
                owner: "root"
                group: "root"
            commands:
              01_create_log_files:
                command: |
                  touch /var/log/spiced.log /var/log/spiced.error.log
                  chown ubuntu:ubuntu /var/log/spiced.log /var/log/spiced.error.log
                  chmod 644 /var/log/spiced.log /var/log/spiced.error.log
              02_run_initial_update:
                command: /usr/local/bin/update-spice.sh
              03_enable_spiced:
                command: |
                  systemctl daemon-reload
                  systemctl enable spiced
                  systemctl start spiced
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          
          # Enable command logging and exit on error
          set -x
          exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1
          
          echo "Starting UserData script execution..."
          
          # Install CloudWatch Logs agent
          curl -o /root/amazon-cloudwatch-agent.deb https://s3.amazonaws.com/amazoncloudwatch-agent/debian/amd64/latest/amazon-cloudwatch-agent.deb
          dpkg -i -E /root/amazon-cloudwatch-agent.deb

          # Setup EBS volume
          echo "Setting up EBS volume..."
          while [ ! -e /dev/nvme1n1 ] && [ ! -e /dev/xvdf ]; do
            echo "Waiting for EBS volume to be attached..."
            sleep 5
          done

          DEVICE_NAME="/dev/nvme1n1"
          if [ ! -e "$DEVICE_NAME" ]; then
            DEVICE_NAME="/dev/xvdf"
          fi

          # Check if the volume is already formatted
          if ! blkid $DEVICE_NAME; then
            echo "Formatting EBS volume..."
            mkfs -t ext4 $DEVICE_NAME || {
              echo "Failed to format EBS volume"
              exit 1
            }
          fi

          # Create mount point and add to fstab
          echo "Creating mount point..."
          mkdir -p /data || {
            echo "Failed to create /data directory"
            exit 1
          }

          # Get the UUID of the formatted volume
          UUID=$(blkid -s UUID -o value $DEVICE_NAME)
          if [ -z "$UUID" ]; then
            echo "Failed to get UUID of formatted volume"
            exit 1
          fi

          # Add to fstab using UUID
          echo "UUID=$UUID /data ext4 defaults,nofail 0 2" >> /etc/fstab || {
            echo "Failed to update fstab"
            exit 1
          }

          # Mount the volume
          mount /data || {
            echo "Failed to mount volume"
            exit 1
          }

          # Set permissions
          chown ubuntu:ubuntu /data
          chmod 755 /data

          echo "Creating app directory..."
          mkdir -p /app || {
            echo "Failed to create /app directory"
            exit 1
          }

          # Initialize CloudFormation helper scripts
          apt-get update
          apt-get -y install python3-pip
          pip3 install https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-latest.tar.gz
          
          # Set up the cfn-hup configuration
          mkdir -p /etc/cfn/hooks.d
          
          cat > /etc/cfn/cfn-hup.conf << EOF
          [main]
          stack=${AWS::StackName}
          region=${AWS::Region}
          interval=1
          EOF
          
          cat > /etc/cfn/hooks.d/cfn-auto-reloader.conf << EOF
          [cfn-auto-reloader-hook]
          triggers=post.update
          path=Resources.EC2Instance.Metadata.AWS::CloudFormation::Init
          action=/usr/local/bin/cfn-init -v --stack ${AWS::StackName} --resource EC2Instance --region ${AWS::Region} --configsets default
          runas=root
          EOF
          
          # Start cfn-hup
          systemctl enable cfn-hup
          systemctl start cfn-hup
          
          # Run cfn-init
          /usr/local/bin/cfn-init -v --stack ${AWS::StackName} --resource EC2Instance --region ${AWS::Region} --configsets default || error_exit 'Failed to run cfn-init'

          # Signal CloudFormation that the instance is ready
          /usr/local/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource EC2Instance --region ${AWS::Region}

          echo "UserData script completed successfully"
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-instance

Outputs:
  InstanceId:
    Description: ID of the EC2 instance
    Value: !Ref EC2Instance

  InstancePrivateIP:
    Description: Private IP address of the EC2 instance
    Value: !GetAtt EC2Instance.PrivateIp 